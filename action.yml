name: overflow-audit
description: Fail when a page scrolls sideways on a phone. Names the elements that stick out and uploads screenshots.
author: John Ennis
branding:
  icon: smartphone
  color: orange

inputs:
  urls:
    description: URLs or paths to check, one per line (# comments allowed).
    default: ""
  file:
    description: A file listing URLs or paths, one per line (# comments allowed).
    default: ""
  base:
    description: Base URL that paths are resolved against, e.g. http://localhost:3000.
    default: ""
  widths:
    description: Viewport widths in CSS pixels, separated by spaces.
    default: "390"
  settle:
    description: Milliseconds to wait after each page loads.
    default: "1500"
  timeout:
    description: Milliseconds to wait for each page to start rendering before reporting it as an error.
    default: "30000"
  setup:
    description: Path to an ESM module whose default export signs in (context, { base }) => Promise<void>.
    default: ""
  ignore:
    description: Extra CSS selectors to hide during the check, one per line.
    default: ""
  screenshots:
    description: Upload a full-page screenshot per page and width as a workflow artifact.
    default: "true"
  artifact-name:
    description: Name of the screenshots artifact. Change it when you run the action more than once in a job.
    default: overflow-audit
  package:
    description: npm install spec for the CLI. Defaults to the version released with this action.
    default: overflow-audit@0.1.0 # x-release-please-version

runs:
  using: composite
  steps:
    - name: Install overflow-audit and Chromium
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/overflow-audit-cli" "$PACKAGE" playwright
        "$RUNNER_TEMP/overflow-audit-cli/node_modules/.bin/playwright" install --with-deps chromium

    - name: Run overflow-audit
      shell: bash
      env:
        URLS: ${{ inputs.urls }}
        FILE: ${{ inputs.file }}
        BASE: ${{ inputs.base }}
        WIDTHS: ${{ inputs.widths }}
        SETTLE: ${{ inputs.settle }}
        TIMEOUT: ${{ inputs.timeout }}
        SETUP: ${{ inputs.setup }}
        IGNORE: ${{ inputs.ignore }}
        SCREENSHOTS: ${{ inputs.screenshots }}
        SHOTS: ${{ runner.temp }}/overflow-audit-shots/${{ inputs.artifact-name }}
      run: |
        trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; printf '%s' "${s%"${s##*[![:space:]]}"}"; }
        args=()
        if [ -n "$FILE" ]; then args+=(--file "$FILE"); fi
        if [ -n "$BASE" ]; then args+=(--base "$BASE"); fi
        read -ra widths <<< "$WIDTHS" || true
        for w in "${widths[@]}"; do args+=(--width "$w"); done
        if [ -n "$(trim "$SETTLE")" ]; then args+=(--settle "$(trim "$SETTLE")"); fi
        if [ -n "$(trim "$TIMEOUT")" ]; then args+=(--timeout "$(trim "$TIMEOUT")"); fi
        if [ -n "$SETUP" ]; then args+=(--setup "$SETUP"); fi
        # Selectors aren't comments: #main is a selector.
        while IFS= read -r line; do
          s="$(trim "$line")"
          if [ -n "$s" ]; then args+=(--ignore "$s"); fi
        done <<< "$IGNORE"
        if [ "$SCREENSHOTS" = "true" ]; then
          rm -rf "$SHOTS"
          args+=(--screenshots "$SHOTS")
        fi
        # URLs go after --, so one starting with - isn't read as an option.
        args+=(--)
        while IFS= read -r line; do
          u="$(trim "$line")"
          if [ -n "$u" ] && [ "${u:0:1}" != "#" ]; then args+=("$u"); fi
        done <<< "$URLS"
        "$RUNNER_TEMP/overflow-audit-cli/node_modules/.bin/overflow-audit" "${args[@]}"

    - name: Upload screenshots
      if: always() && inputs.screenshots == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/overflow-audit-shots/${{ inputs.artifact-name }}
        if-no-files-found: ignore
