<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;font:16px sans-serif}</style></head>
<body><h1>Fixed, but held</h1><p>Each box makes its position: fixed child scroll with the page.</p><div style="will-change:transform;height:50px"><div class="wc" style="position:fixed;left:0;width:600px;height:40px;background:#f99"></div></div><div style="backdrop-filter:blur(2px);height:50px"><div class="bf" style="position:fixed;left:0;width:600px;height:40px;background:#9f9"></div></div><div style="container-type:inline-size;height:50px"><div class="ct" style="position:fixed;left:0;width:600px;height:40px;background:#99f"></div></div></body></html>
