<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;font:16px sans-serif}</style></head>
<body><h1>Toggle</h1><button id="open" type="button">Open menu</button><div id="sheet" class="sheet" hidden style="width:600px">a menu that is too wide</div>
<script>document.getElementById('open').addEventListener('click', () => { document.getElementById('sheet').hidden = false; });</script></body></html>
